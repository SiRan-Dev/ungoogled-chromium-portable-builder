<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ungoogled Chromium 便携版下载</title>
<meta name="description" content="下载最新构建的 ungoogled-chromium 便携版，自动识别设备架构。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
<style>
  :root {
    --bg: #f5f7fb;
    --bg-glow: radial-gradient(900px 500px at 50% -10%, #dbeafe 0%, transparent 70%);
    --card: #ffffff;
    --card-soft: #f8fafc;
    --fg: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --accent: #2563eb;
    --accent-2: #3b82f6;
    --shadow: 0 10px 30px rgba(15, 23, 42, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f17;
      --bg-glow: radial-gradient(900px 500px at 50% -10%, #1e3a8a55 0%, transparent 70%);
      --card: #131a25;
      --card-soft: #0f1621;
      --fg: #e8eef7;
      --muted: #94a3b8;
      --border: #24303f;
      --accent: #3b82f6;
      --accent-2: #60a5fa;
      --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg) no-repeat;
    background-image: var(--bg-glow);
    color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 64px 20px 72px; }

  header { text-align: center; margin-bottom: 36px; }
  h1 {
    margin: 0 0 10px;
    font-size: clamp(26px, 5vw, 38px);
    letter-spacing: -.02em;
    background: linear-gradient(100deg, var(--fg) 30%, var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub { margin: 0; color: var(--muted); font-size: 15px; }
  .meta {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    margin-top: 18px; font-size: 13px; color: var(--muted);
  }
  .chip {
    padding: 4px 12px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
  }

  .hero { padding: 28px; margin-bottom: 20px; }
  .hero .label {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 10px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .hero h2 { margin: 0 0 6px; font-size: 21px; letter-spacing: -.01em; }
  .hero p { margin: 0; color: var(--muted); font-size: 14px; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 20px; padding: 15px 22px;
    border-radius: 12px; border: 1px solid transparent;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    color: #fff; font-size: 16px; font-weight: 600;
    text-decoration: none; transition: transform .12s ease, box-shadow .2s ease, opacity .2s;
    box-shadow: 0 6px 18px rgba(37, 99, 235, .28);
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(37, 99, 235, .34); }
  .btn:active { transform: translateY(0); }
  .btn small { font-weight: 400; opacity: .85; font-size: 13px; }
  .btn[aria-disabled="true"] { opacity: .55; pointer-events: none; filter: grayscale(.3); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 26px; }
  .opt {
    display: flex; flex-direction: column; padding: 16px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--border);
    transition: border-color .15s, transform .12s, background .15s;
  }
  .opt:hover { border-color: var(--accent); transform: translateY(-2px); }
  .opt-link { text-decoration: none; color: inherit; display: block; }
  .opt .arch { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  .opt .desc { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .opt .size { margin-top: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .opt .rec { display: inline-block; margin-top: 10px; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--accent); }
  .opt.is-rec { background: var(--card-soft); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }

  .sha { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .sha-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
  }
  .sha code {
    margin: 6px 0 0; padding: 0; background: none; border: 0;
    font-size: 10px; line-height: 1.5; color: var(--muted); word-break: break-all;
  }
  .copy {
    border: 1px solid var(--border); background: var(--card-soft); color: var(--muted);
    border-radius: 6px; padding: 2px 8px; cursor: pointer;
    font-family: inherit; font-size: 10px; letter-spacing: 0; text-transform: none;
    transition: color .15s, border-color .15s;
  }
  .copy:hover { color: var(--accent); border-color: var(--accent); }

  .notice {
    display: none; padding: 12px 16px; border-radius: 12px; margin-bottom: 18px;
    font-size: 13.5px;
    background: color-mix(in srgb, var(--accent) 8%, var(--card));
    border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--border));
    color: var(--fg);
  }
  .notice.show { display: block; }

  details {
    margin-top: 14px; font-size: 12.5px; color: var(--muted);
  }
  summary { cursor: pointer; user-select: none; }
  code {
    display: block; margin-top: 8px; padding: 10px 12px;
    background: var(--card-soft); border: 1px solid var(--border); border-radius: 8px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 11.5px; word-break: break-all; color: var(--fg);
  }

  footer { text-align: center; color: var(--muted); font-size: 13px; }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  .skeleton { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 0; }
  .err { color: #dc2626; }
  @media (max-width: 620px) {
    .wrap { padding: 40px 16px 56px; }
    .grid { grid-template-columns: 1fr; }
    .hero { padding: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ungoogled Chromium 便携版</h1>
    <p class="sub">去谷歌化 Chromium · 集成 Chrome++ 补丁 · 解压即用</p>
    <div class="meta">
      <span class="chip" id="tag">加载中…</span>
      <span class="chip" id="updated">正在获取最新版本</span>
    </div>
  </header>

  <div class="notice" id="notice"></div>

  <section class="card hero">
    <div class="label"><span class="dot"></span>为你的设备推荐</div>
    <h2 id="hero-title">正在识别设备架构…</h2>
    <p id="hero-desc">页面会读取浏览器上报的 CPU 架构，为你选择最合适的版本。</p>
    <a class="btn" id="hero-btn" href="#" aria-disabled="true">正在获取下载地址…</a>
    <details id="hash-box" hidden>
      <summary>SHA-256 校验值</summary>
      <code id="hash-text"></code>
    </details>
  </section>

  <div class="grid" id="grid">
    <div class="skeleton" style="grid-column:1/-1">加载可用版本…</div>
  </div>

  <footer>
    <p>
      适用于 Windows 10 及以上版本 ·
      <a href="https://github.com/SiRan-Dev/ungoogled-chromium-portable-builder/releases" target="_blank" rel="noopener">全部版本</a> ·
      <a href="https://github.com/SiRan-Dev/ungoogled-chromium-portable-builder" target="_blank" rel="noopener">源码仓库</a>
    </p>
    <noscript><p>需要启用 JavaScript 才能自动识别架构，你也可以直接前往 Releases 页面手动下载。</p></noscript>
  </footer>
</div>

<script>
(function () {
  const REPO = 'SiRan-Dev/ungoogled-chromium-portable-builder';
  const API = 'https://api.github.com/repos/' + REPO + '/releases/latest';
  const FALLBACK = './latest.json';
  const CACHE_KEY = 'ucpb.latest.v2';
  const CACHE_TTL = 5 * 60 * 1000;

  const LABELS = {
    x64:   { title: 'x64 版',   desc: '适用于绝大多数 64 位 Windows 设备' },
    x86:   { title: 'x86 版',   desc: '适用于 32 位 Windows 系统' },
    arm64: { title: 'arm64 版', desc: '适用于 Windows on ARM 设备' }
  };

  const $ = (id) => document.getElementById(id);

  function formatSize(bytes) {
    if (!bytes) return '';
    const mb = bytes / 1000000;
    return (mb >= 100 ? mb.toFixed(0) : mb.toFixed(1)) + ' MB';
  }

  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' });
    } catch (_) { return ''; }
  }

  function copyText(text, btn) {
    const flash = function () {
      btn.textContent = '已复制';
      setTimeout(function () { btn.textContent = '复制'; }, 1500);
    };
    const fallback = function () {
      if (!document.body) return;
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); flash(); } catch (_) { }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(flash, fallback);
    } else {
      fallback();
    }
  }

  async function detectArch() {
    const isWindows = /Windows/i.test(navigator.userAgent) ||
      (navigator.userAgentData && navigator.userAgentData.platform === 'Windows');

    if (!isWindows) return { arch: null, isWindows: false, note: '当前设备似乎不是 Windows' };

    const uaData = navigator.userAgentData;
    if (uaData && uaData.getHighEntropyValues) {
      try {
        const v = await uaData.getHighEntropyValues(['architecture', 'bitness']);
        if (v.architecture === 'arm') return { arch: 'arm64', isWindows: true, note: 'ARM64' };
        if (v.architecture === 'x86') {
          return v.bitness === '32'
            ? { arch: 'x86', isWindows: true, note: '32 位系统' }
            : { arch: 'x64', isWindows: true, note: '64 位系统' };
        }
      } catch (_) { /* 隐私设置可能阻止高熵值 */ }
    }

    if (/ARM64|aarch64/i.test(navigator.userAgent) || /ARM/i.test(navigator.platform || '')) {
      return { arch: 'arm64', isWindows: true, note: 'ARM64' };
    }
    return { arch: 'x64', isWindows: true, note: '64 位系统' };
  }

  function parseAssets(release) {
    const list = [];
    (release.assets || []).forEach(function (a) {
      if (!/\.7z$/i.test(a.name)) return;
      const m = a.name.match(/-(arm64|x64|x86)-/i);
      if (!m) return;
      const arch = m[1].toLowerCase();
      list.push({
        arch: arch,
        name: a.name,
        url: a.url,
        size: a.size,
        digest: a.digest || ''
      });
    });
    const order = { x64: 0, x86: 1, arm64: 2 };
    return list.sort(function (a, b) { return order[a.arch] - order[b.arch]; });
  }

  // 统一 API 与 latest.json 两种数据源的结构
  function normalize(data) {
    return {
      tag: data.tag_name || data.tag || '',
      name: data.name || data.tag_name || '',
      published: data.published_at || data.published || '',
      url: data.html_url || ('https://github.com/' + REPO + '/releases/latest'),
      assets: (data.assets || []).map(function (a) {
        return {
          name: a.name,
          size: a.size,
          url: a.browser_download_url || a.url,
          digest: a.digest || ''
        };
      })
    };
  }

  async function getJson(url, options) {
    const res = await fetch(url, options);
    if (!res.ok) throw new Error(url + ' -> HTTP ' + res.status);
    return res.json();
  }

  async function loadRelease() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (raw) {
        const cached = JSON.parse(raw);
        if (Date.now() - cached.t < CACHE_TTL && cached.d) return cached.d;
      }
    } catch (_) { }

    let data;
    try {
      // 主数据源：GitHub API（无认证时限每 IP 60 次/小时）
      data = await getJson(API, { headers: { Accept: 'application/vnd.github+json' } });
    } catch (apiErr) {
      // 兜底：发布流程生成的同源快照，不受限流影响
      data = await getJson(FALLBACK + '?t=' + Date.now(), { cache: 'no-store' });
    }

    const slim = normalize(data);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), d: slim })); } catch (_) { }
    return slim;
  }

  async function init() {
    const notice = $('notice');
    const heroBtn = $('hero-btn');
    const heroTitle = $('hero-title');
    const heroDesc = $('hero-desc');
    const grid = $('grid');
    const hashBox = $('hash-box');

    const detected = await detectArch();

    let release, assets;
    try {
      release = await loadRelease();
      assets = parseAssets(release);
      if (!assets.length) throw new Error('最新版本暂无可用安装包');
    } catch (err) {
      $('tag').textContent = '获取失败';
      $('updated').textContent = '请稍后重试';
      heroTitle.textContent = '暂时无法获取下载信息';
      heroDesc.textContent = 'GitHub API 可能触发了访问频率限制，请直接前往 Releases 页面下载。';
      heroBtn.textContent = '打开 Releases 页面';
      heroBtn.href = 'https://github.com/' + REPO + '/releases/latest';
      heroBtn.removeAttribute('aria-disabled');
      grid.innerHTML = '<div class="skeleton err">' + err.message + '</div>';
      return;
    }

    $('tag').textContent = release.tag;
    $('updated').textContent = release.published ? '发布于 ' + formatDate(release.published) : '最新版本';

    const recommended = assets.find(function (a) { return a.arch === detected.arch; }) || assets[0];
    const label = LABELS[recommended.arch] || { title: recommended.arch, desc: '' };

    if (!detected.isWindows) {
      notice.className = 'notice show';
      notice.textContent = '检测到当前设备可能不是 Windows。以下安装包仅适用于 Windows 10 及以上系统，请根据目标设备选择。';
    }

    heroTitle.textContent = 'Windows ' + recommended.arch + ' 便携版';
    heroDesc.textContent = detected.isWindows
      ? label.desc + ' · 检测到 ' + detected.note + ' · ' + formatSize(recommended.size)
      : label.desc + ' · ' + formatSize(recommended.size);
    heroBtn.innerHTML = '立即下载 <small>' + formatSize(recommended.size) + '</small>';
    heroBtn.href = recommended.url;
    heroBtn.removeAttribute('aria-disabled');

    if (recommended.digest && recommended.digest.indexOf('sha256:') === 0) {
      hashBox.hidden = false;
      $('hash-text').textContent = recommended.digest.replace('sha256:', '');
    }

    grid.innerHTML = '';
    assets.forEach(function (a) {
      const info = LABELS[a.arch] || { title: a.arch, desc: '' };
      const isRec = a.arch === recommended.arch;
      const hash = (a.digest || '').replace(/^sha256:/i, '');

      const card = document.createElement('div');
      card.className = 'opt' + (isRec ? ' is-rec' : '');

      const link = document.createElement('a');
      link.className = 'opt-link';
      link.href = a.url;
      link.innerHTML =
        '<div class="arch">' + info.title + '</div>' +
        '<div class="desc">' + info.desc + '</div>' +
        '<div class="size">' + formatSize(a.size) + '</div>' +
        (isRec ? '<div class="rec">推荐</div>' : '');
      card.appendChild(link);

      if (hash) {
        const sha = document.createElement('div');
        sha.className = 'sha';

        const head = document.createElement('div');
        head.className = 'sha-head';

        const label = document.createElement('span');
        label.textContent = 'SHA-256';
        head.appendChild(label);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'copy';
        btn.textContent = '复制';
        btn.addEventListener('click', function () { copyText(hash, btn); });
        head.appendChild(btn);

        const code = document.createElement('code');
        code.textContent = hash;

        sha.appendChild(head);
        sha.appendChild(code);
        card.appendChild(sha);
      }

      grid.appendChild(card);
    });
  }

  init();
})();
</script>
</body>
</html>
